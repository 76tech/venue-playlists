# Venue list. One playlist is maintained per venue.
#
# Fields per venue:
#   name                  display name
#   slug                  stable id (used for cover-art filenames, etc.)
#   source                "ticketmaster" | "scrape"  (where to read the calendar)
#   ticketmaster_venue_id required when source == ticketmaster
#   calendar_url          the venue's public calendar (scrape source, and shown on the page)
#   spotify_playlist_id   filled in automatically after the first run (do not hand-edit)
#
# tracks_per_artist and max_tracks can be overridden per venue if needed.

defaults:
  tracks_per_artist: 3
  max_tracks: 50
  lookahead_days: 120

cities:
  - name: Pittsburgh
    timezone: America/New_York
    venues:
      - name: Mr. Smalls Theatre
        slug: mr-smalls-theatre-pgh
        source: ticketmaster
        ticketmaster_venue_id: KovZpZAAd7tA
        calendar_url: https://mrsmalls.com/listing/upcoming-theatre-events/

      - name: Thunderbird Café & Music Hall
        slug: thunderbird-music-hall-pgh
        source: ticketmaster
        ticketmaster_venue_id: KovZpZA1edEA
        calendar_url: https://thunderbirdmusichall.com/shows/

      - name: Club Cafe
        slug: club-cafe-pgh
        source: ticketmaster
        ticketmaster_venue_id: KovZpZAaI6lA
        calendar_url: https://www.clubcafelive.com/upcoming-shows

      - name: Roxian Theatre
        slug: roxian-theatre-pgh
        source: ticketmaster
        ticketmaster_venue_id: KovZ917Ax13
        calendar_url: https://www.roxiantheatre.com/

      - name: Spirit Hall
        slug: spirit-hall-pgh
        source: ticketmaster
        ticketmaster_venue_id: KovZ917A_J7
        calendar_url: https://www.spiritpgh.com/calendar
